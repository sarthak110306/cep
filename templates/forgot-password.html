<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Community Hackathon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% include '_flash.html' %}

    <header>

        <div class="eyebrow">
            Community Hackathon 2026
        </div>

        <h1>
            Reset Your Password
        </h1>

        <p>
            Enter your registered email and create a new password.
        </p>

        <div class="modal-overlay active" style="position:relative; inset:auto; background:none; backdrop-filter:none;">

            <div class="login-box">

                <h2>
                    Forgot Password
                </h2>

                <p class="hint">
                    Create a new password for your account.
                </p>

                <form
                    method="POST"
                    action="{{ url_for('forgot_password') }}"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="Registered Email"
                        required
                    >

                    <input
                        type="password"
                        name="new_password"
                        placeholder="New Password (min 5 characters)"
                        minlength="5"
                        required
                    >

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm New Password"
                        minlength="5"
                        required
                    >

                    <button
                        class="btn"
                        type="submit"
                    >
                        Reset Password
                    </button>

                </form>

                <p class="foot">

                    <a href="{{ url_for('index') }}">
                        ← Back to Login
                    </a>

                </p>

            </div>

        </div>

    </header>

    <footer>
        © 2026 Community Hackathon. All Rights Reserved.
    </footer>

</body>

</html>
