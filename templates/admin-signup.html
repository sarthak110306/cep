<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Sign Up — Community Hackathon</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% include '_flash.html' %}

    <header>
        <div class="eyebrow">Admin Portal</div>

        <h1>Community Hackathon 2026</h1>

        <p>
            Create a new administrator account.
        </p>
    </header>


    <div style="max-width:420px;margin:40px auto;padding:0 20px;">

        <div class="login-box"
             style="position:relative;transform:none;opacity:1;">

            <h2>Create Admin Account</h2>

            <p class="hint">
                Register a new administrator
            </p>


            <form method="POST"
                  action="{{ url_for('admin_signup') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <input
                    type="text"
                    name="name"
                    placeholder="Admin Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Admin Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required
                >

                <button class="btn" type="submit">
                    Create Admin Account
                </button>

            </form>


            <p class="foot" style="margin-top:20px;">
                <a href="{{ url_for('admin_login') }}">
                    ← Back to Admin Login
                </a>
            </p>

        </div>

    </div>


    <footer>
        © 2026 Community Hackathon. All Rights Reserved.
    </footer>

</body>
</html>
