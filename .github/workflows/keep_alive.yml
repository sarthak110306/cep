name: Keep Render App Alive

on:
  schedule:
    # Run every 12 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        env:
          RENDER_URL: ${{ secrets.RENDER_APP_URL || 'https://community-hackathon.onrender.com' }}
        run: |
          echo "Pinging Render service at $RENDER_URL/healthz..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/healthz" || true)
          echo "HTTP response status: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Received status $RESPONSE (service may still be waking up)"
          fi
